name: tunerstudio
adopt-info: tunerstudio
title: TunerStudio MS
summary: UNOFFICIAL - TunerStudio MS - an advanced MegaSquirt Tuning Software
description: |
  TunerStudio MS, the most advanced and refined MegaSquirt Tuning software available.
  The registered and Lite! editions are the same installer.
  
  After installing, run the following commands:
  
  sudo snap connect tunerstudio:raw-usb
  sudo snap connect tunerstudio:removable-media
  sudo snap connect tunerstudio:bluez
  sudo snap connect tunerstudio:bluetooth-control
  
  This is NOT an officially supported snap from EFI Analytics.

base: core24
grade: stable
confinement: strict
compression: lzo
icon: snap/gui/tunerstudio.png
# "Proprietary" (capitalised) is what snap pack accepts; snapcraft suggests
# lowercase "proprietary", but snapd rejects it as an unknown license.
license: Proprietary
contact: https://www.tunerstudio.com/
website: https://www.tunerstudio.com/
issues: https://github.com/kz6fittycent/TunerStudio-snap/issues
source-code: https://github.com/kz6fittycent/TunerStudio-snap

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  tunerstudio: 
    extensions: 
      - gnome
    command: launch
    plugs:
      - network
      - network-bind
      - home
      - raw-usb
      - removable-media
      - browser-support
      - audio-playback
      - pulseaudio  # compatibility with snapd <2.41
      - x11
      - desktop
      - desktop-legacy
      - bluez
      - bluetooth-control
    environment: 
      JAVA_HOME: $SNAP/usr/lib/jvm/java-17-openjdk-amd64
      JRE_HOME: $SNAP/usr/lib/jvm/java-17-openjdk-amd64/jre  
      
parts:
  tunerstudio:    
    plugin: nil
    # Upstream has no stable "latest" URL, so the newest Linux tarball is
    # discovered from the download page (see snap/local/tunerstudio-latest.sh).
    override-pull: |
      set -eu
      LATEST=$(sh "$CRAFT_PROJECT_DIR/snap/local/tunerstudio-latest.sh")
      VERSION=${LATEST%% *}
      URL=${LATEST#* }
      echo "Fetching TunerStudio MS $VERSION from $URL"
      rm -rf TunerStudioMS tunerstudio.tar.gz
      curl -fSL --retry 5 --retry-delay 5 -o tunerstudio.tar.gz "$URL"
      gzip -t tunerstudio.tar.gz
      tar -xzf tunerstudio.tar.gz
      rm tunerstudio.tar.gz
      test -f TunerStudioMS/TunerStudioMS.jar
      craftctl set version="$VERSION"

    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cp -r "$CRAFT_PART_SRC/TunerStudioMS" "$CRAFT_PART_INSTALL/bin/"

    build-packages:
      - ca-certificates
      - curl
      - gzip
      - tar

    stage-packages:
      - openjdk-17-jdk
      - openjdk-17-jre
      - librxtx-java    
      - fontconfig
      - fontconfig-config
      - libfontconfig1
      - x11-xserver-utils
      - x11-utils
      - libgtk-3-dev   

    stage:
    - -usr/lib/jvm/java-17-openjdk-*/lib/security/cacerts
    - -usr/lib/jvm/java-17-openjdk-*/lib/security/blocked.certs 
    - -usr/lib/jvm/java-17-openjdk-amd64/jre/lib/security/cacerts
    
  launcher:
    plugin: dump
    source: scripts
       
  cleanup:
    after:
      - tunerstudio
      - launcher
    plugin: nil
    build-snaps: 
      - core24
