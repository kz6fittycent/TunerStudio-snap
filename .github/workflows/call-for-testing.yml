name: 📣 Call for Testing

# Builds the latest stable TunerStudio MS release from EFI Analytics, uploads
# it to latest/candidate, opens a "Call for testing" issue and attaches
# screenshots from a clean desktop VM. Promotion to stable is done by
# commenting "/promote <revision> stable [done]" on that issue (see
# promote-to-stable.yml).
on:
  # Rebuild whenever the packaging changes on main.
  push:
    branches: [ main ]
    paths:
      - 'snap/**'
      - 'scripts/**'
      - '.github/workflows/call-for-testing.yml'

  # Daily check of the EFI Analytics download page for a new release.
  schedule:
    - cron: '30 10 * * *'

  workflow_dispatch:
    inputs:
      force:
        description: 'Build and publish even if candidate already has the latest upstream version'
        type: boolean
        default: false

permissions:
  contents: read

# Never let two uploads race each other.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SNAP_NAME: tunerstudio

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      upstream: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Find latest upstream version
        id: upstream
        run: |
          LATEST=$(sh snap/local/tunerstudio-latest.sh)
          echo "version=${LATEST%% *}" >> "$GITHUB_OUTPUT"
          echo "Upstream: $LATEST"

      - name: Find version currently in candidate
        id: store
        run: |
          VERSION=$(curl -fsS --retry 3 -H 'Snap-Device-Series: 16' \
            "https://api.snapcraft.io/v2/snaps/info/${SNAP_NAME}?fields=version" \
            | jq -r '."channel-map"[] | select(.channel.track == "latest" and .channel.risk == "candidate" and .channel.architecture == "amd64") | .version' \
            | head -n1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Store latest/candidate: ${VERSION:-<none>}"

      - name: Decide whether to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          UPSTREAM: ${{ steps.upstream.outputs.version }}
          STORE: ${{ steps.store.outputs.version }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$FORCE" = "true" ] || [ "$UPSTREAM" != "$STORE" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building $UPSTREAM (candidate has ${STORE:-nothing}, event: $EVENT)"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "latest/candidate already at $STORE, nothing to do"
          fi

  publish-candidate:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.upload.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build

      - name: Determine the built version
        id: version
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
          UPSTREAM: ${{ needs.check.outputs.upstream }}
        run: |
          # tunerstudio_<version>_amd64.snap
          version="$(basename "$SNAP_FILE" | sed -E "s/^${SNAP_NAME}_(.+)_[^_]+\.snap$/\1/")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Built $SNAP_FILE (version ${version})"
          if [ "$version" != "$UPSTREAM" ]; then
            echo "::warning::Built version ${version} differs from ${UPSTREAM} seen by the check job (upstream may have changed mid-run)"
          fi

      - uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SNAP_NAME }}-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 14

      - name: Upload to the candidate channel
        id: upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          # Not "latest/candidate": a `snapcraft export-login` macaroon's
          # channel grant is the bare risk levels (stable/candidate/beta/
          # edge), so the store rejects the track-prefixed form with
          # invalid-channel-permission.
          output="$(snapcraft upload "${{ steps.build.outputs.snap }}" --release=candidate)"
          echo "$output"

          revision="$(grep -Po 'Revision \K[0-9]+' <<< "$output")"
          if [[ -z "$revision" ]]; then
            echo "Could not parse a revision number out of 'snapcraft upload' output."
            exit 1
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

  open-issue:
    needs: publish-candidate
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue-number: ${{ steps.create.outputs.issue-number }}
    steps:
      - name: Ensure the call-for-testing label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "call-for-testing" \
            --repo "${{ github.repository }}" \
            --color "FBCA04" \
            --description "Automated candidate build ready for testing" \
            2>/dev/null || true

      - name: Create the call for testing issue
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-candidate.outputs.version }}
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          # The "/promote <revision>[,<revision>...] stable [done]" syntax
          # here is what promote-to-stable.yml parses back out of the
          # triggering comment - keep the two in sync. "stable", not
          # "latest/stable", for the same macaroon reason as the upload.
          body=$(cat <<EOF
          A new candidate build of TunerStudio MS is ready for testing.

          **TunerStudio version:** ${VERSION}
          **Revision:** ${REVISION}
          **Channel:** \`latest/candidate\`

          ## How to test

          1. Install or refresh to this build:

             \`\`\`
             sudo snap install ${SNAP_NAME} --channel latest/candidate
             # or, if already installed:
             sudo snap refresh ${SNAP_NAME} --channel latest/candidate
             \`\`\`

          2. Connect the interfaces TunerStudio needs to talk to an ECU:

             \`\`\`
             sudo snap connect ${SNAP_NAME}:raw-usb
             sudo snap connect ${SNAP_NAME}:removable-media
             sudo snap connect ${SNAP_NAME}:bluez
             sudo snap connect ${SNAP_NAME}:bluetooth-control
             \`\`\`

          3. Launch it, open a project (or an example project) and, if you can, connect to an ECU or simulator.
          4. Automated screenshots from a clean VM will be added to this issue shortly, as a sanity check that the build actually launches.

          ## How to release it

          Once you're satisfied this revision is good, promote it to stable by commenting:

          \`\`\`
          /promote <revision>[,<revision>...] stable [done]
          \`\`\`

          - \`<revision>\` - the revision number(s) to release (comma-separated for more than one)
          - \`stable\` - required as shown; this command only ever promotes to \`stable\`
          - \`done\` (optional) - also closes this issue once released; leave it off to release and keep the issue open for further testing

          For this revision, that's:

          \`\`\`
          /promote ${REVISION} stable done
          \`\`\`

          That queues \`promote-to-stable.yml\`, which waits for approval in GitHub's UI (the \`promote-stable\` environment) before it runs \`snapcraft release\`.

          ---
          _Opened automatically after a successful candidate build._
          EOF
          )

          url=$(gh issue create \
            --repo "${{ github.repository }}" \
            --title "Call for testing: TunerStudio ${VERSION} (revision ${REVISION})" \
            --label "call-for-testing" \
            --body "$body")
          echo "issue-number=$(basename "$url")" >> "$GITHUB_OUTPUT"

  screenshots:
    needs: [publish-candidate, open-issue]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable KVM access for the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.1

      - name: Install ghvmctl
        run: |
          # Retried: the Snap Store's CDN occasionally 502s mid-download.
          for attempt in 1 2 3; do
            if sudo snap install ghvmctl; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::snap install ghvmctl failed after 3 attempts"
              exit 1
            fi
            echo "snap install ghvmctl failed (attempt ${attempt}/3), retrying in 30s..."
            sleep 30
          done
          sudo snap connect ghvmctl:lxd lxd:lxd

      - name: Launch a desktop VM and install the candidate snap
        env:
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          ghvmctl prepare

          # NOT `ghvmctl snap-install`: it always appends `--classic`,
          # which the store rejects for this strict-confinement snap.
          ghvmctl exec "sudo snap install ${SNAP_NAME} --revision ${REVISION}"

          ghvmctl snap-run "${SNAP_NAME}"

          # gnome-screenshot can succeed against the bare desktop before
          # the app has mapped a window, and TunerStudio (Java) is slow to
          # start in a fresh VM, so a fixed grace period stands in.
          sleep 90

      - name: Capture screenshots
        run: |
          ghvmctl screenshot-full
          ghvmctl screenshot-window

      - name: Publish screenshots to the screenshots branch
        id: publish
        env:
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin screenshots >/dev/null 2>&1; then
            git fetch origin screenshots
            git checkout -B screenshots origin/screenshots
          else
            git checkout --orphan screenshots
            git rm -rf --quiet .
          fi

          dest="revision-${REVISION}"
          mkdir -p "$dest"
          cp -L ~/ghvmctl-screenshots/screenshot-screen.png "$dest/screen.png"
          cp -L ~/ghvmctl-screenshots/screenshot-window.png "$dest/window.png"

          git add "$dest"
          git commit -m "Add screenshots for revision ${REVISION}"

          # Retried (with a rebase) for transient GitHub errors or a real
          # concurrent push.
          for attempt in 1 2 3; do
            if git push origin screenshots; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::git push to the screenshots branch failed after 3 attempts"
              exit 1
            fi
            echo "git push failed (attempt ${attempt}/3), retrying in 10s..."
            sleep 10
            git fetch origin screenshots
            git rebase origin/screenshots
          done

          echo "dest=${dest}" >> "$GITHUB_OUTPUT"

      - name: Comment on the call for testing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
          REVISION: ${{ needs.publish-candidate.outputs.revision }}
          DEST: ${{ steps.publish.outputs.dest }}
        run: |
          base="https://raw.githubusercontent.com/${{ github.repository }}/screenshots/${DEST}"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          Automated screenshots from revision ${REVISION}, installed fresh in a clean Ubuntu desktop VM:

          ![Full screen](${base}/screen.png)

          ![App window](${base}/window.png)

          ---

          Looks good? Comment \`/promote ${REVISION} stable done\` on this issue to release it to \`latest/stable\` and close this issue (drop \`done\` to release without closing).
          EOF
          )"

      # Without this, an infra failure above leaves the issue promising
      # screenshots "shortly" forever.
      - name: Comment on the issue if screenshot capture failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.open-issue.outputs.issue-number }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          Automated screenshot capture failed for this revision - most likely a transient infrastructure hiccup (the Snap Store's CDN or GitHub itself), not a problem with the build. See the [workflow run](${run_url}) for details.

          The build itself is unaffected - go ahead and test it manually using the install command above.
          EOF
          )"

  # GitHub disables scheduled workflows after 60 days without repository
  # activity, which is part of why this snap stopped updating in 2024. This
  # re-enables the workflow via the API without needing dummy commits.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
