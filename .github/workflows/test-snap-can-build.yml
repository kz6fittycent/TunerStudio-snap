name: 🧪 Snap Builds

# Pull requests only: pushes to main are built and published to candidate by
# call-for-testing.yml.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: build

      - uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'
          # Plugs and Slots declarations to override default denial (requires store assertion to publish)
          # plugs: ./plug-declaration.json
          # slots: ./slot-declaration.json

      - uses: actions/upload-artifact@v7
        with:
          name: tunerstudio-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7
